<!DOCTYPE html>
<html>
<head>
<style>
table{
    border-collapse: collapse;
    width: 50%;
}

th,td{
    border: 1px solid black;
    padding: 10px;
}

tr:nth-child(even){
    background-color: lightgray;
}
</style>
</head>
<body>

<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
    </tr>

    <tr>
        <td>John</td>
        <td>20</td>
    </tr>

    <tr>
        <td>Sam</td>
        <td>22</td>
    </tr>

    <tr>
        <td>David</td>
        <td>21</td>
    </tr>
</table>

</body>
</html>
